plugins { id 'com.android.application' }

def product = new groovy.json.JsonSlurper().parse(file('../../package.json'))
android {
    namespace 'com.wyswang.clocktower'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.wyswang.clocktower'
        minSdk 26
        targetSdk 35
        versionCode 500
        versionName product.version
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; cppFlags '-std=c++17' } }
        testInstrumentationRunner 'com.wyswang.clocktower.SmokeInstrumentation'
    }
    externalNativeBuild { cmake { path 'CMakeLists.txt'; version '3.22.1' } }
    sourceSets { main { jniLibs.srcDirs = ['libnode/bin', 'src/main/jniLibs'] } }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/libnode.so', '**/libcloudflared.so'] } }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; disable 'ObsoleteSdkInt', 'SetJavaScriptEnabled' }
}

// 只复制运行白名单；不扫描工作区，避免把密钥、对局或其他项目塞进 APK。
tasks.register('stageGame', Sync) {
    from('../..') {
        include 'server.js', 'package.json', 'engine/**', 'lib/**', 'public/**'
    }
    into 'src/main/assets/game'
}
tasks.named('preBuild').configure { dependsOn 'stageGame' }
